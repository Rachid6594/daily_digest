name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r Dailydigest/requirement.txt

      - name: Check Django config
        run: |
          cd Dailydigest
          python manage.py check --deploy 2>&1 || true
        env:
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          SECRET_KEY: test-secret-key-ci
          DEBUG: "False"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontdailydigest/package-lock.json

      - name: Install frontend dependencies
        run: cd frontdailydigest && npm ci

      - name: Build frontend
        run: cd frontdailydigest && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2002
          debug: true
          command_timeout: 10m
          script: |
            cd ${{ secrets.APP_PATH }}
            echo "=== Git pull ==="
            git pull origin main
            echo "=== Docker compose down ==="
            docker compose down
            echo "=== Docker compose build ==="
            docker compose build --no-cache
            echo "=== Docker compose up ==="
            docker compose up -d
            echo "=== Django migrate ==="
            docker compose exec -T backend python manage.py migrate --noinput
            echo "=== Django collectstatic ==="
            docker compose exec -T backend python manage.py collectstatic --noinput
            echo "=== Caddy reload ==="
            caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            echo "✓ Deploiement termine avec succes"
